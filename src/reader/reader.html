<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' manga: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Yomuchu</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="reader.css">
<script src="../shared/theme.js"></script>
</head>
<body>
<div id="backdrop"></div>

<div id="stage">
  <div id="zoomer">
    <div id="book" class="hidden-book">
      <div class="board left"></div><div class="board right"></div>
      <div class="stack left"></div><div class="stack right"></div>
      <div class="slot left" id="slotL"><div class="img"></div><div class="paper"></div><div class="cast"></div><div class="tap"></div></div>
      <div class="slot right" id="slotR"><div class="img"></div><div class="paper"></div><div class="cast"></div><div class="tap"></div></div>
      <div class="spine"></div>
      <div id="leaf"></div>
    </div>
  </div>
</div>

<header id="topbar" class="bar-top">
  <div class="grip" data-i18n-title="rd.dragWin">
    <svg viewBox="0 0 24 24"><circle cx="8" cy="7" r="1.4"/><circle cx="16" cy="7" r="1.4"/><circle cx="8" cy="12" r="1.4"/><circle cx="16" cy="12" r="1.4"/><circle cx="8" cy="17" r="1.4"/><circle cx="16" cy="17" r="1.4"/></svg>
  </div>
  <button class="tb" id="btnLibrary" data-i18n-title="rd.libraryTip"><svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h3v18H6a2 2 0 0 1-2-2z"/><path d="M9 3h5v18H9z"/><path d="m15 4 4.5 1.2-4 15.3L15 20"/></svg><span data-i18n="lib.title"></span></button>
  <div class="title-wrap drag"><div class="series" id="seriesName"></div><div class="title" id="titleName" data-i18n="rd.loading"></div></div>
  <div class="group">
    <button class="tb" id="btnDir" data-i18n-title="rd.dirTip"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg><span id="dirLabel"></span></button>
    <button class="tb" id="btnMode" data-i18n-title="rd.modeTip"><svg id="modeIcon" viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="14" rx="1"/><rect x="13" y="5" width="8" height="14" rx="1"/></svg><span id="modeLabel"></span></button>
    <button class="tb icon" id="btnSound" data-i18n-title="rd.soundTip"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6"/><path class="wave" d="M18.5 6.5a8 8 0 0 1 0 11"/><path class="mute" d="m16 9 5 6m0-6-5 6"/></svg></button>
    <button class="tb icon" id="btnHelp" data-i18n-title="rd.helpTip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><circle cx="12" cy="17" r=".6"/></svg></button>
    <button class="tb icon" id="btnFull" data-i18n-title="rd.fullTip"><svg viewBox="0 0 24 24"><path class="enter" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="exit" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
    <span class="sep"></span>
    <button class="tb icon" id="btnMin" data-i18n-title="rd.minimize"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button class="tb icon close" id="btnClose" data-i18n-title="rd.closeTip"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</header>

<footer id="bottombar" class="bar-bottom">
  <span class="counter" id="counter">—</span>
  <div class="slider-wrap">
    <input type="range" id="slider" min="0" max="0" value="0" step="1" data-i18n-aria="rd.page">
    <div class="preview" id="preview"><img alt="" id="previewImg"><span id="previewNum"></span></div>
  </div>
  <button class="tb icon small" id="btnZoomOut" data-i18n-title="rd.zoomOut"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <button class="zoom-val" id="zoomVal" data-i18n-title="rd.zoomReset">100%</button>
  <button class="tb icon small" id="btnZoomIn" data-i18n-title="rd.zoomIn"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
</footer>

<div id="resizer" data-i18n-title="rd.resize"><svg viewBox="0 0 16 16"><path d="M14 6 6 14M14 10l-4 4"/></svg></div>

<div id="help" class="overlay hidden">
  <div class="help-card">
    <h2 data-i18n="help.title"></h2>
    <div class="keys">
      <span><kbd>←</kbd> <kbd>→</kbd></span><span data-i18n="help.turn"></span>
      <span><kbd>PgDn</kbd> <kbd data-i18n="key.space"></kbd></span><span data-i18n="help.next"></span>
      <span><kbd>PgUp</kbd> <kbd>Shift</kbd>+<kbd data-i18n="key.space"></kbd></span><span data-i18n="help.prev"></span>
      <span><kbd>Home</kbd> <kbd>End</kbd></span><span data-i18n="help.coverLast"></span>
      <span data-i18n="help.mouse"></span><span data-i18n="help.mouseAct"></span>
      <span><kbd>F11</kbd> <kbd>F</kbd> · <span data-i18n="keys.dblclick"></span></span><span data-i18n-html="help.fs"></span>
      <span><kbd>Ctrl</kbd> + roda · <kbd>+</kbd> <kbd>-</kbd></span><span data-i18n-html="help.zoom"></span>
      <span><kbd>D</kbd></span><span data-i18n="help.dir"></span>
      <span><kbd>M</kbd></span><span data-i18n="help.mode"></span>
      <span><kbd>S</kbd></span><span data-i18n="help.sound"></span>
      <span><kbd>B</kbd></span><span data-i18n="help.back"></span>
    </div>
    <p class="tip" data-i18n-html="help.tip"></p>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="loading" class="loading"><div class="spinner"></div></div>
<script src="../i18n.js"></script>
<script src="reader.js"></script>
</body>
</html>
